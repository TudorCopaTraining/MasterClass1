name: Build SCORM Packages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to trigger it manually from the website

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run SCORM Builder Script
      run: python build-scorm.py

    - name: Upload SCORM Zip Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: scorm-packages
        path: |
          AIEthics_SCORM.zip
          AIRiskAssessment_SCORM.zip
          EDIinAI_SCORM.zip
          IntelligentAutomation_SCORM.zip
