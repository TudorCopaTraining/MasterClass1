<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Intelligent Automation Lab: Hands & Brains in Action</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            ia: {
              hands: '#06b6d4',
              brain: '#8b5cf6',
              human: '#f59e0b',
              dark: '#0b0f19',
              card: '#131b2e'
            }
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0b0f19; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
    
    .glass-panel {
      background: rgba(19, 27, 46, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .dashed-grid {
      background-size: 28px 28px;
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }

    @media print {
      body * { visibility: hidden; }
      #printableCert, #printableCert * { visibility: visible; }
      #printableCert {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 20px;
        background: white !important;
        color: black !important;
        border: 2px solid #000;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 font-sans min-h-screen selection:bg-purple-500/30 selection:text-purple-200 dashed-grid antialiased flex flex-col justify-between">

  <!-- Top Navigation & Timed Exercise Bar -->
  <header class="sticky top-0 z-50 glass-panel border-b border-slate-800 px-4 sm:px-6 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 via-indigo-500 to-purple-600 p-0.5 shadow-lg shadow-purple-500/20 flex items-center justify-center">
          <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
            <i data-lucide="cpu" class="w-5 h-5 text-cyan-400"></i>
          </div>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-bold text-base sm:text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-cyan-300 bg-clip-text text-transparent">
              Intelligent Automation Lab
            </span>
            <span class="text-[10px] font-mono uppercase bg-purple-950/80 text-purple-300 border border-purple-800/60 px-2 py-0.5 rounded-full font-semibold">
