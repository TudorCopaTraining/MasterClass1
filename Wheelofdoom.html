<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gen AI Film Challenge: Wheel of Doom</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #161822;
            --accent-color: #ff3e6c;
            --accent-glow: rgba(255, 62, 108, 0.3);
            --success-color: #00f5d4;
            --text-color: #f1f3f9;
            --text-muted: #8f96a3;
            --border-color: #222533;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        h1 {
            margin: 0 0 12px 0;
            font-size: 2.4rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(45deg, var(--accent-color), #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .challenge-text {
            color: var(--text-muted);
            margin: 0 0 35px 0;
            font-size: 1.1rem;
            line-height: 1.6;
            padding: 0 10px;
        }

        .display-box {
            background-color: #090a0e;
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 30px 20px;
            margin-bottom: 35px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: border-color 0.3s ease;
        }

        .display-box.active {
            border-color: var(--accent-color);
        }

        .display-box.winner {
            border-color: var(--success-color);
        }

        #element-text {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-muted);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s ease;
        }

        .winner #element-text {
            color: var(--success-color);
            text-shadow: 0 0 15px rgba(0, 245, 212, 0.3);
        }

        #hint-text {
            margin-top: 20px;
            font-size: 1.05rem;
            color: var(--text-muted);
            line-height: 1.5;
            max-width: 90%;
            display: none;
            text-align: left;
            border-top: 1px solid #222533;
            padding-top: 15px;
        }

        .spin-btn {
            background: linear-gradient(135deg, var(--accent-color), #ff6b6b);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.3rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px var(--accent-glow);
            transition: transform 0.1s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }

        .spin-btn:hover {
            opacity: 0.95;
            box-shadow: 0 8px 25px rgba(255, 62, 108, 0.5);
        }

        .spin-btn:active {
            transform: scale(0.97);
        }

        .spin-btn:disabled {
            background: #383c4a;
            color: #686f7d;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>

    </div>
