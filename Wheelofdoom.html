<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gen AI Film Challenge: Wheel of Doom</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #161822;
            --accent-color: #ff3e6c;
            --accent-glow: rgba(255, 62, 108, 0.4);
            --success-color: #00f5d4;
            --text-color: #f1f3f9;
            --text-muted: #8f96a3;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 550px;
            width: 100%;
            text-align: center;
            background: var(--card-bg);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 2.4rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(45deg, var(--accent-color), #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            margin: 0 0 35px 0;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .wheel-wrapper {
            position: relative;
            width: 100%;
            max-width: 420px;
            aspect-ratio: 1 / 1;
            margin: 0 auto 35px auto;
        }

        /* Top indicator arrow styling */
        .ticker {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 28px solid var(--accent-color);
            z-index: 10;
            filter: drop-shadow(0 6px 10px var(--accent-glow));
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 0 10px #222533;
        }

        .spin-btn {
            background: linear-gradient(135deg, var(--accent-color), #ff6b6b);
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 1.25rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px var(--accent-glow);
            transition: transform 0.1s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }

        .spin-btn:hover {
            opacity: 0.95;
            box-shadow: 0 8px 25px rgba(255, 62, 108, 0.6);
        }

        .spin-btn:active {
            transform: scale(0.97);
        }

        .spin-btn:disabled {
            background: #383c4a;
            color: #686f7d;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        #result-display {
            margin-top: 30px;
            font-size: 1.6rem;
            font-weight: 800;
            min-height: 38px;
            color: var(--success-color);
            text-shadow: 0 0 15px rgba(0, 245, 212, 0.3);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Wheel of Doom</h1>
        <p>Spin the wheel to lock in the mandatory creative twist element for your Gen AI film challenge!</p>
        
        <div class="wheel-wrapper">
            <div class="ticker"></div>
            <canvas id="wheel" width="600" height="600"></canvas>
        </div>

        <button class="spin-btn" id="spin-button" onclick="spinWheel()">Spin Wheel</button>
        <div id="result-display"></div>
    </div>

    <script>
        // Expanded to 20 unique prompt combinations
        const elements = [
            "Talking Penguin",
            "Time Travel",
            "Haunted Toaster",
            "AI Assistant",
            "Secret Underground City",
            "Lost Treasure Map",
            "Dragon Accountant",
            "Robot Teacher",
            "Alien Invasion",
            "Mysterious Key",
            "Invisible Sidekick",
            "Cyberpunk Detective",
            "Sentient Smartphone",
            "Medieval Spaceship",
            "Infinite Hallway",
            "Gravity-Defying Boots",
            "Telepathic Houseplant",
            "Shape-Shifting Villain",
            "Underwater Metropolis",
            "Cursed Pocket Watch"
        ];

        // High-contrast alternating neon colors optimized for 20 segments
        const colors = [
            "#ff0055", "#00bbf9", "#ff9f1c", "#00f5d4", "#9b5de5",
            "#f15bb5", "#3a86ff", "#ffbe0b", "#ff4d6d", "#00f5d4",
            "#ff0055", "#00bbf9", "#ff9f1c", "#00f5d4", "#9b5de5",
            "#f15bb5", "#3a86ff", "#ffbe0b", "#ff4d6d", "#00f5d4"
        ];

        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const spinBtn = document.getElementById("spin-button");
        const resultDisplay = document.getElementById("result-display");

        const numSegments = elements.length;
        const segmentAngle = (2 * Math.PI) / numSegments;
        let currentAngle = 0;

        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const radius = canvas.width / 2;
            
            ctx.save();
            ctx.translate(radius, radius);
            ctx.rotate(currentAngle);

            for (let i = 0; i < numSegments; i++) {
                // Render pizza slice geometry
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, i * segmentAngle, (i + 1) * segmentAngle);
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#161822";
                ctx.stroke();

                // Render integrated challenge label
                ctx.save();
                ctx.fillStyle = "#000000";
                // Smaller bold font size to comfortably accommodate 20 text items on the canvas
                ctx.font = "bold 12px sans-serif";
                
                // Align exactly within the center point of the slice segment arc
                ctx.rotate((i + 0.5) * segmentAngle);
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                
                ctx.fillText(elements[i], radius - 20, 0);
                ctx.restore();
            }

            // Aesthetic center hub accent
            ctx.restore();
            ctx.beginPath();
            ctx.arc(radius, radius, 15, 0, 2 * Math.PI);
            ctx.fillStyle = "#ffffff";
            ctx.fill();
            ctx.lineWidth = 5;
            ctx.strokeStyle = "#0d0e12";
            ctx.stroke();
        }

        function spinWheel() {
            spinBtn.disabled = true;
            resultDisplay.textContent = "";

            // Force multi-rotation spin calculations to make landing targets fully variable
            const extraRotations = 6 + Math.floor(Math.random() * 5); // 6 to 10 full turns
            const targetRotation = extraRotations * 2 * Math.PI + Math.random() * 2 * Math.PI;
            
            const duration = 4500; // Smooth 4.5 second timeline
            const startTime = performance.now();
            const startAngle = currentAngle;

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                if (elapsed >= duration) {
                    currentAngle = (startAngle + targetRotation) % (2 * Math.PI);
                    drawWheel();
                    calculateWinner();
                    spinBtn.disabled = false;
                } else {
                    // Cubic Ease-Out curve for an authentic mechanical deceleration feel
                    const t = elapsed / duration;
                    const easeOutCubic = 1 - Math.pow(1 - t, 3);
                    currentAngle = startAngle + targetRotation * easeOutCubic;
                    
                    drawWheel();
                    requestAnimationFrame(animate);
                }
            }
            requestAnimationFrame(animate);
        }

        function calculateWinner() {
            // Adjust calculation based on top fixed ticker placement (-90 degrees offset)
            let trackingAngle = (currentAngle + Math.PI / 2) % (2 * Math.PI);
            if (trackingAngle < 0) trackingAngle += 2 * Math.PI;

            // Invert index conversion step due to standard canvas clockwise graphics layout
            const winningIndex = numSegments - 1 - Math.floor(trackingAngle / segmentAngle);
            const winner = elements[winningIndex % numSegments];
            
            resultDisplay.textContent = `🚨 Twist: ${winner}!`;
        }

        // Draw initial state on canvas load
        drawWheel();
    </script>
</body>
</html>
